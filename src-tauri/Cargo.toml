[package]
name = "folio"
version = "0.2.0"
edition = "2021"
description = "A local PDF reader with contextual AI"

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:rfd"]

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }

[dependencies]
tauri = { version = "2", optional = true , features = [] }
rfd = { version = "0.15", optional = true, default-features = false, features = ["gtk3", "common-controls-v6"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[[bin]]
name = "folio"
required-features = ["desktop"]
path = "src/main.rs"
